server.port=9001

#Configurations H2
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#Le schéma est créé par schema.sql, pas par Hibernate
spring.jpa.hibernate.ddl-auto=none
#defini l'encodage pour schema.sql et data.sql
spring.sql.init.encoding=UTF-8

#Pas de serveur Eureka dans ce TP : on désactive l'enregistrement
eureka.client.enabled=false

#Les configurations externalisées
mes-configs.limitDeProduits=3

#Configuration Actuator
management.endpoints.web.exposure.include=*
#management.endpoints.web.exposure.include=refresh
